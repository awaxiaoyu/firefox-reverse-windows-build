name: Build Windows package

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FIREFOX_REV: cebc55aab4d2661d1f6c2d1526362947ec4016c1

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Checkout pinned Firefox source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target }}" == windows ]]; then git config --global core.longpaths true; fi
          git init upstream
          git -C upstream remote add origin https://github.com/mozilla-firefox/firefox.git
          git -C upstream fetch --depth 1 origin "$FIREFOX_REV"
          git -C upstream checkout --detach FETCH_HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build agent-sidebar bundle
        shell: bash
        working-directory: additions/browser/components/agent-sidebar
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -s content/agent-sidebar.bundle.js

      - name: Install MozillaBuild
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'MozillaBuildSetup-4.2.1.exe'
          Invoke-WebRequest -Uri 'https://archive.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-4.2.1.exe' -OutFile $installer
          $p = Start-Process -FilePath $installer -ArgumentList @('/S', '/D=C:\mozilla-build') -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path 'C:\mozilla-build\msys2')) { throw 'MozillaBuild installation failed' }

      - name: Install rsync on Windows
        if: matrix.target == 'windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install rsync -y --no-progress
          $rsync = Get-ChildItem -Path 'C:\Program Files','C:\ProgramData\chocolatey\lib' -Filter rsync.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $rsync) { throw 'rsync.exe was not found after installation' }
          $rsync.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Apply Firefox-Reverse patches
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.target }}" == windows ]]; then git -C upstream config apply.ignoreWhitespace change; fi
          if [[ "${{ matrix.target }}" == windows ]]; then export PATH="/c/mozilla-build/msys2/usr/bin:$PATH"; fi
          UPSTREAM_DIR="$GITHUB_WORKSPACE/upstream" PYTHON=python bash "$GITHUB_WORKSPACE/scripts/apply-patches.sh"
          node "$GITHUB_WORKSPACE/scripts/check-branding-assets.mjs" "$GITHUB_WORKSPACE/upstream"

      - name: Move Windows source to a short path
        if: matrix.target == 'windows'
        shell: pwsh
        run: Move-Item -LiteralPath upstream -Destination D:\f

      - name: Cache Mozilla build toolchain
        if: matrix.target == 'windows'
        uses: actions/cache@v4
        with:
          path: C:\Users\runneradmin\.mozbuild
          key: mozbuild-windows-${{ env.FIREFOX_REV }}
          restore-keys: mozbuild-windows-

      - name: Bootstrap, build, and package
        shell: bash
        working-directory: ${{ matrix.target == 'windows' && 'D:\f' || 'upstream' }}
        run: |
          set -euo pipefail
          ./mach --no-interactive bootstrap --application-choice browser
          ./mach configure --with-branding=browser/branding/unofficial
          ./mach build
          ./mach package

      - name: Upload Windows package
        if: matrix.target == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: firefox-reverse-windows-x86_64
          path: D:/f/obj-*/dist/firefox-*.win64.zip
          if-no-files-found: error
          retention-days: 14
